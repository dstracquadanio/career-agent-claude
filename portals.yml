# Portal Scanner Configuration
# Add companies to scan, with career page URLs and role filters
# Usage: tell Claude "scan portals" or "scan jobs"

# Your search preferences
preferences:
  locations:
    - United States
    - USA
    - US
    - Remote
    - Hybrid
    - New York
    - San Francisco
    - Chicago
    - Austin
    - Seattle
    - Boston
    - Los Angeles
    - Denver
    - Atlanta
    - Miami
    - Columbus
    - any US city
  role_keywords:
    - product manager
    - associate product manager
    - business analyst
    - data analyst
    - BI analyst
    - strategy operations
    - strategy associate
    - product operations
    - business operations
    - operations associate
    - AI product
    - AI analyst
    - AI automation
    - platform associate
    - product analyst
    - growth analyst
    - analytics
  exclude_keywords:
    - senior staff
    - staff engineer
    - principal
    - director
    - VP
    - head of
    - chief
    - 10+ years
    - 8+ years
  min_match_keywords: 2

